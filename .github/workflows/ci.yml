name: Checks
on:
  pull_request:
  push:
    branches: [main, integrate/session-board]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
